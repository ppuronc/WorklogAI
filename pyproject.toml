[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-project"
version = "0.1.0"
description = "Standard data engineering project scaffold with pandas, CrewAI, and LangChain tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "crewai>=0.100.0",
  "openpyxl>=3.1.0",
  "requests>=2.31.0",
  "langchain>=0.3.0",
  "PyYAML>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
